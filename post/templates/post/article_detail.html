{% extends 'base.html'%}

{% block title %}
    <title>{{ article.title }}</title>
{% endblock %}

{% block content %}

    <h1>{{ article.title|upper }}</h1>


    <article class="article-detail">
        <h2>{{ article.title }}</h2>
        <img src="{{ article.thumbnail.url }}" alt="Image blog">
        <h5>Publie par <i> {{ article.author_default}}</i> le {{ article.date_create|date:'j F Y' }}</h5>
        <p>{{ article.content|safe|linebreaks }}</p>
    </article>



{% endblock %}
